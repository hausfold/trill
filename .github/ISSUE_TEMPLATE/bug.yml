# Generated by workshop/script/issue-templates.sh — edit the generator, not this.
name: Bug report
description: Something about notifications doesn't work
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Wrong repo? File it anyway.** hausfold is one product split across
        eight repositories, and working out which one owns your bug is our job,
        not yours — we move issues between them in one click.

        There's no telemetry in any of this, ever. This form is the only way we
        find out.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: |
        What you did, what you expected, and what you got instead. Verbatim
        beats tidy — "it said something about a lock file" is worth more
        polished than nothing.
      placeholder: |
        I …
        I expected …
        Instead …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in trill?
      description: A guess is fine. It only routes the first look.
      options:
        - a banner — wrong, missing, or won't go away
        - rules.json — something isn't matching
        - the trill CLI
        - an action button
        - digest or catch-up
        - the GitHub provider
        - installing or updating
        - the docs
        - somewhere else, or not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: |-
        Diagnostics
      description: |-
        **Trill's menu bar ▸ Report a Bug…, or `trill report`, fills this in for you** — version, macOS build, Mac model, and whether Full Disk Access is granted. Nothing is sent until you press Submit. If your problem is a banner arriving *twice*, add the output of `trill doctor` as well: it only reads — it changes nothing and sends nothing anywhere. If it says it needs Full Disk Access, paste that too; it's an answer.
      render: text
    validations:
      required: false
  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: A screenshot, a log line, a hunch about what caused it. Optional — send the form without it rather than not sending it.
    validations:
      required: false
