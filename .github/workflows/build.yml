name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  build-and-test:
    name: Native build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Analyze
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze
      - name: Release build
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
