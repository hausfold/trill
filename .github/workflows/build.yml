name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — which on this repo is a macOS runner every
# job here needs.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  # Two macOS jobs, cut at the one boundary the steps actually have: a
  # `-derivedDataPath`. `Test` and `Analyze` share a Debug DerivedData —
  # `Analyze` is ~6s only because it reads what `Test` already built, so it must
  # stay below it — while `Release build` and the instrumentation guard share a
  # Release one and reuse nothing from Debug. Nothing crosses, so neither job
  # `needs:` the other and they run side by side.
  #
  # The sources compiled twice inside one job before this: ~79s of Debug in
  # `Test`, then ~53s of Release from nothing. That job was 155s over eight PR
  # runs and it was the only job in the repo, so it was the gate by default.
  #
  # PLACEHOLDER: run both ways before trusting this paragraph.
  test:
    name: Debug tests and analyze
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      # MUST stay in this job and below `Test`: same `-derivedDataPath`, and the
      # whole reason it is ~6s rather than another Debug build.
      - name: Analyze
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze

  # The Release half: one build and the thing that reads the bundle it leaves in
  # DerivedData. Every step here needs a Release `Trill.app`, which is what makes
  # it a group rather than a spread.
  release-build:
    name: Release build and bundle guard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # Rides here rather than on the gate, and rather than in an ubuntu job of
      # its own: it measures 0s, which is an order of magnitude under what a job
      # costs around its steps, so rule 5 says it joins an existing one — and
      # this is the half nothing is waiting on. It still fails as early as it
      # ever did, since both jobs start together.
      #
      # Before the build, because these are the cheapest failures in the repo
      # and two of them are invisible at runtime: a SKILL.md whose frontmatter
      # is broken installs, lists and is never loaded, and an embedded copy that
      # has drifted makes `trill skill` print last week's prose with this week's
      # version number. The three-argument form is the one that checks the
      # embed; nix/skill.nix runs the same script over the prose alone, because
      # it has no Swift to compare against.
      - name: Agent skills are well-formed and still embedded
        run: scripts/check-skills.sh ai Trill/CLI/EmbeddedSkills.swift scripts/generate-skills.sh

      - name: Release build
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Deliberately NOT passing ENABLE_CODE_COVERAGE=NO above: the point is to
      # prove the setting in project.pbxproj still holds on a stock `build`.
      # An instrumented binary is invisible until it runs — the app binary IS
      # the trill CLI, and LLVM's profile runtime then writes `default.profraw`
      # into whatever directory it exits in. That put one untracked file in
      # every agent worktree `scruff notify` fired from, making them unreapable.
      #
      # Through the script rather than inline so this and the release workflow
      # run the SAME guard: a check that only the PR build does is a check the
      # release can drift past. The script walks every Mach-O in the bundle,
      # not just the main executable, and fails when it finds none to examine.
      #
      # "Still holds on a stock `build`" is about the project setting, not about
      # this job: `test` now runs on another runner entirely, so what this proves
      # is that a Release `build` is clean on its own, with no `test` in front of
      # it to have leaked the default in.
      - name: Release build carries no profiling instrumentation
        run: scripts/assert-no-instrumentation.sh DerivedData/Build/Products/Release/Trill.app
