name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  build-and-test:
    name: Native build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Analyze
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze
      - name: Release build
        run: |
          xcodebuild \
            -project Trill.xcodeproj \
            -scheme Trill \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Deliberately NOT passing ENABLE_CODE_COVERAGE=NO above: the point is to
      # prove the setting in project.pbxproj still holds on a stock `build`.
      # An instrumented binary is invisible until it runs — the app binary IS
      # the trill CLI, and LLVM's profile runtime then writes `default.profraw`
      # into whatever directory it exits in. That put one untracked file in
      # every agent worktree `scruff notify` fired from, making them unreapable.
      #
      # Through the script rather than inline so this and the release workflow
      # run the SAME guard: a check that only the PR build does is a check the
      # release can drift past. The script walks every Mach-O in the bundle,
      # not just the main executable, and fails when it finds none to examine.
      - name: Release build carries no profiling instrumentation
        run: scripts/assert-no-instrumentation.sh DerivedData/Build/Products/Release/Trill.app
