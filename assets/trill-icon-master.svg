    <rect x="14" y="52" width="72" height="34" rx="10" fill="#494949"/>
    <circle cx="26" cy="63" r="4.5" fill="#f7e2b5"/>
    <rect x="36" y="59" width="38" height="5" rx="2.5" fill="#5c5c5c"/>
    <rect x="36" y="69" width="26" height="5" rx="2.5" fill="#5c5c5c"/>
